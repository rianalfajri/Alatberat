<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kasir Alat Berat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Layout Utama */
        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* Bagian Katalog (Kiri) */
        .catalog-section {
            flex: 2;
            padding: 20px;
            overflow-y: auto;
            background-color: #f8f9fa;
        }

        .header {
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #f39c12;
        }

        .header h1 {
            color: #2c3e50;
            font-size: 24px;
        }

        .header p {
            color: #7f8c8d;
            font-size: 14px;
        }

        .grid-catalog {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: #fff;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            border: 1px solid #e0e0e0;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
            border-color: #f39c12;
        }

        .product-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .product-name {
            font-weight: bold;
            font-size: 16px;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .product-price {
            color: #e67e22;
            font-weight: 600;
            font-size: 14px;
        }

        /* Bagian Kasir/Keranjang (Kanan) */
        .cart-section {
            flex: 1;
            background: #fff;
            border-left: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            box-shadow: -2px 0 10px rgba(0,0,0,0.05);
        }

        .cart-header {
            padding: 20px;
            background: #2c3e50;
            color: #fff;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .item-info h4 {
            font-size: 14px;
            color: #2c3e50;
        }

        .item-info p {
            font-size: 12px;
            color: #7f8c8d;
        }

        .item-qty {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-qty {
            background: #e0e0e0;
            border: none;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-qty:hover {
            background: #d0d0d0;
        }

        /* Bagian Total & Pembayaran */
        .cart-footer {
            padding: 20px;
            background: #f9f9f9;
            border-top: 1px solid #eee;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #2c3e50;
        }

        .btn-checkout {
            width: 100%;
            background: #f39c12;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-checkout:hover {
            background: #d35400;
        }

        .btn-clear {
            width: 100%;
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            margin-top: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="catalog-section">
            <div class="header">
                <h1>Heavy Equipment POS</h1>
                <p>Sistem Kasir Penyewaan / Penjualan Alat Berat</p>
            </div>
            <div class="grid-catalog" id="catalog-container">
                </div>
        </div>

        <div class="cart-section">
            <div class="cart-header">
                <h2>Keranjang Order</h2>
            </div>
            
            <div class="cart-items" id="cart-container">
                <p style="color: #95a5a6; text-align: center; margin-top: 20px;">Belum ada unit yang dipilih.</p>
            </div>

            <div class="cart-footer">
                <div class="total-row">
                    <span>Total:</span>
                    <span id="total-price">Rp 0</span>
                </div>
                <button class="btn-checkout" onclick="checkout()">Proses Transaksi</button>
                <button class="btn-clear" onclick="clearCart()">Kosongkan Keranjang</button>
            </div>
        </div>
    </div>

    <script>
        // Data Katalog Alat Berat (Bisa disesuaikan harga per hari / per unit)
        const products = [
            { id: 1, name: "Excavator CAT 320", price: 5000000, icon: "🏗️" },
            { id: 2, name: "Bulldozer D6R", price: 6500000, icon: "🚜" },
            { id: 3, name: "Wheel Loader", price: 4000000, icon: "📦" },
            { id: 4, name: "Motor Grader", price: 5500000, icon: "🛣️" },
            { id: 5, name: "Vibratory Roller", price: 3500000, icon: "🔴" },
            { id: 6, name: "Mobile Crane 50T", price: 9000000, icon: "🏗️" },
            { id: 7, name: "Dump Truck 20m³", price: 2500000, icon: "🚛" },
            { id: 8, name: "Skid Steer Loader", price: 3000000, icon: "🚜" }
        ];

        let cart = [];

        // Format angka ke Rupiah
        function formatRupiah(angka) {
            return "Rp " + angka.toLocaleString('id-ID');
        }

        // Render Katalog ke HTML
        function renderCatalog() {
            const catalogContainer = document.getElementById('catalog-container');
            catalogContainer.innerHTML = '';

            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.onclick = () => addToCart(product.id);
                
                card.innerHTML = `
                    <div class="product-icon">${product.icon}</div>
                    <div class="product-name">${product.name}</div>
                    <div class="product-price">${formatRupiah(product.price)} / hari</div>
                `;
                catalogContainer.appendChild(card);
            });
        }

        // Tambah Item ke Keranjang
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const cartItem = cart.find(item => item.id === productId);

            if (cartItem) {
                cartItem.qty += 1;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            renderCart();
        }

        // Ubah jumlah item (Tambah / Kurang)
        function changeQty(productId, delta) {
            const cartItem = cart.find(item => item.id === productId);
            if (cartItem) {
                cartItem.qty += delta;
                if (cartItem.qty <= 0) {
                    cart = cart.filter(item => item.id !== productId);
                }
            }
            renderCart();
        }

        // Kosongkan Keranjang
        function clearCart() {
            cart = [];
            renderCart();
        }

        // Render data Keranjang & Hitung Total
        function renderCart() {
            const cartContainer = document.getElementById('cart-container');
            const totalPriceElement = document.getElementById('total-price');
            
            if (cart.length === 0) {
                cartContainer.innerHTML = '<p style="color: #95a5a6; text-align: center; margin-top: 20px;">Belum ada unit yang dipilih.</p>';
                totalPriceElement.innerText = 'Rp 0';
                return;
            }

            cartContainer.innerHTML = '';
            let total = 0;

            cart.forEach(item => {
                const itemTotal = item.price * item.qty;
                total += itemTotal;

                const itemRow = document.createElement('div');
                itemRow.className = 'cart-item';
                itemRow.innerHTML = `
                    <div class="item-info">
                        <h4>${item.name}</h4>
                        <p>${formatRupiah(item.price)} x ${item.qty}</p>
                    </div>
                    <div class="item-qty">
                        <button class="btn-qty" onclick="changeQty(${item.id}, -1)">-</button>
                        <span>${item.qty}</span>
                        <button class="btn-qty" onclick="changeQty(${item.id}, 1)">+</button>
                    </div>
                `;
                cartContainer.appendChild(itemRow);
            });

            totalPriceElement.innerText = formatRupiah(total);
        }

        // Fungsi Simulasikan Checkout
        function checkout() {
            if (cart.length === 0) {
                alert("Keranjang masih kosong!");
                return;
            }
            alert("Transaksi Berhasil Diproses! Silakan cetak invoice.");
            clearCart();
        }

        // Jalankan fungsi saat aplikasi pertama dimuat
        renderCatalog();
    </script>
</body>
  </html>
